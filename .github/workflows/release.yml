# The demo's release: demo and demo-guest, static for linux/amd64 (`task release:build`), so a reader
# runs the demo without Go. Named as spin-stack names releases, v<YYYYMMDD>.<NN>. A person dispatches
# it on main, and only there: the tarball is signed as release.yml@refs/heads/main, the identity the
# README holds it to, and `task release` refuses a commit ci.yml's Gate has not passed on.
name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # task release asks proven whether the Gate passed on the commit, which reads its runs.
      actions: read
      # Keyless signing: a short-lived certificate bound to this workflow at this ref.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag, which the release's name is counted from; task release fetches them again,
          # with this checkout's credentials, from a private repository.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: The binaries
        run: go tool task release:build

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # The bundle is checked against the identity that made it: one nothing verifies is a step
      # that can quietly stop working.
      - name: Sign the tarball
        env:
          IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          f=_output/release/shirudo-demo_linux_amd64.tar.gz
          cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          cosign verify-blob --bundle "$f.sigstore.json" --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"

      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: go tool task release
