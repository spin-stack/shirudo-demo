version: '3'

run: once

includes:
  common:
    taskfile: '{{.GO_TOOLS_TASKS}}'
    flatten: true
    vars:
      RELEASE:
        map: {proof: ci.yml, jobs: Gate, files: _output/release/*.tar.gz _output/release/*.sigstore.json _output/release/checksums.txt}

env:
  WORK: '{{.WORK}}'

vars:
  WORK: '{{.WORK | default (print .ROOT_DIR "/work")}}'
  OUT: '{{.WORK}}/out'
  BIN: '{{.WORK}}/bin'
  DEMO: '{{.BIN}}/demo'

tasks:
  default:
    desc: Every step, in order, then stop the machine.
    cmds:
      - task: init
      - task: cve
      - task: obs
      - task: stop

  bin:
    desc: demo and demo-guest in work/bin, static for linux/amd64, as the release builds them.
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: amd64
    cmds:
      - go build -trimpath -ldflags='-s -w' -o '{{.BIN}}/' ./cmd/demo ./cmd/demo-guest

  release:build:
    desc: Reproducible release tarball and checksums.txt in _output/release.
    vars:
      OUT: '{{.ROOT_DIR}}/_output/release'
    cmds:
      - rm -rf '{{.OUT}}'
      - task: bin
        vars: {BIN: '{{.OUT}}/shirudo-demo'}
      - >-
        tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git show -s --format=%ct HEAD)"
        -C '{{.OUT}}' -czf '{{.OUT}}/shirudo-demo_linux_amd64.tar.gz' shirudo-demo
      - cd '{{.OUT}}' && sha256sum shirudo-demo_linux_amd64.tar.gz > checksums.txt

  machine:
    desc: Download, verify (sha256, Sigstore) and unpack the pinned spin-machine release and shirudo-operator in work/machine.
    deps: [bin]
    cmds:
      - '{{.DEMO}} machine'

  check:
    desc: machine, then check the release's files, passt's user namespace, /dev/kvm and git.
    deps: [bin]
    cmds:
      - '{{.DEMO}} check'

  operator:
    desc: In a guest without shirudo, build the key, images, packages, units and initrd into work/out; evidence/operator.txt.
    deps: [check]
    sources: [versions.yaml, cmd/demo-guest/operator.go]
    generates:
      - '{{.OUT}}/keys/cert.der'
      - '{{.OUT}}/images/runtime.roothash'
      - '{{.OUT}}/packages/cve-2025-24813-1.0.0.bee'
      - '{{.OUT}}/packages/kernel-obs-1.0.0.bee'
      - '{{.OUT}}/runtime-service.conf'
      - '{{.OUT}}/initrd.img'
    cmds:
      - '{{.DEMO}} operator'

  stage:
    desc: The ext4 image the shirudo machine mounts at /opt/demo.
    deps: [operator, bin]
    sources:
      - '{{.OUT}}/initrd.img'
      - '{{.OUT}}/images/*'
      - '{{.OUT}}/packages/*'
      - '{{.BIN}}/demo-guest'
      - '{{.OUT}}/runtime-service.conf'
    generates:
      - '{{.OUT}}/stage.img'
    cmds:
      - '{{.DEMO}} stage'

  provision:
    desc: A new 8 GiB disk over the release's base image, booted without shirudo; demo-guest provision installs shirudo's images, units and Python.
    deps: [stage, bin]
    sources:
      - '{{.OUT}}/images/*'
      - '{{.OUT}}/runtime-service.conf'
      - cmd/demo-guest/provision.go
    generates:
      - '{{.WORK}}/disk.qcow2'
    cmds:
      - '{{.DEMO}} provision'

  boot:
    desc: spin-machine boot --lockdown shirudo --tpm --initrd --net, its console on a socket; the stage disk at /opt/demo.
    deps: [provision, bin]
    status:
      - '{{.DEMO}} running'
    cmds:
      - '{{.DEMO}} boot'

  init:
    desc: The command line, lockdown, both shirudo init runs, shirudo status and image status; evidence/init.txt.
    deps: [boot, stage]
    cmds:
      - '{{.DEMO}} init'

  cve:
    desc: The registry's setup, then payload, load, payload, unload, payload (0, 10, 0), then its tools/test; evidence/cve*.txt.
    deps: [boot, stage]
    cmds:
      - '{{.DEMO}} cve'

  obs:
    desc: Load kernel-obs, run a program, read /etc/shadow, resolve a name, connect twice, read the tables back; evidence/obs.txt.
    deps: [boot, stage]
    cmds:
      - '{{.DEMO}} obs'

  stop:
    desc: Power the guest off. work/disk.qcow2 and work/tpm stay, so `go tool task boot init` boots the same machine again.
    deps: [bin]
    cmds:
      - '{{.DEMO}} stop'

  clean:
    desc: Stop the machine and remove work/, this run's key with it.
    cmds:
      - task: stop
      - rm -rf '{{.WORK}}' .task

  record:
    desc: Record the README's run against the latest release into evidence/demo-run.cast (asciinema), from a new DIR (default /var/tmp/shirudo-run).
    vars:
      DIR: '{{.DIR | default "/var/tmp/shirudo-run"}}'
    cmds:
      - if [ -x '{{.DIR}}/shirudo-demo/demo' ]; then cd '{{.DIR}}/shirudo-demo' && ./demo stop; fi
      - rm -rf '{{.DIR}}'
      - bash scripts/record.sh '{{.DIR}}'

  test:
    desc: gofmt, vet and test the demo's Go, and build the release's binaries.
    cmds:
      - test -z "$(gofmt -l .)"
      - task: bin
      - go vet ./...
      - go test ./...
