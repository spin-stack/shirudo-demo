- name: spin-machine
  kind: download
  source: https://github.com/spin-stack/machine/releases/download/{version}/spin-machine-{version}-linux-x86_64.tar.gz
  version: v20261127.02
  pin: 835e3cc280e851a6077cb565257b2c4c01cd0335752c19a492d2de63573f958d
  track: github-release https://github.com/spin-stack/machine
  note: >-
    the machine the demo boots, as released: QEMU, the kernel with shirudo's hooks, the base image,
    swtpm, passt, bin/spin-machine and guest/shirudo, the static shirudo the guest runs.
    `demo machine` downloads it, checks this sha256 and the tarball's Sigstore bundle (release.yml
    at refs/heads/main), and unpacks it in work/machine. A bump is a whole run,
    `go tool task clean && go tool task`, and moves shirudo-operator with it.

- name: shirudo-operator
  kind: download
  source: https://github.com/spin-stack/machine/releases/download/{version}/spin-machine-{version}-linux-x86_64.shirudo-operator.tar.gz
  version: v20261127.02
  pin: 8ab7a554a7fb62479bf2003e93904d088ea29971ae72e442bc7dca4230c89038
  track: with spin-machine
  note: >-
    the same release's operator half of shirudo (its docs/shirudo.md): shirudo-build, clang, the
    gen-image and gen-initrd tools, the BPF headers and vmlinux.h of the release's kernel, the
    units, kernel-obs, and the Ubuntu packages they need. `demo machine` checks it as it checks
    the machine and unpacks it over it; `demo operator` runs it in a guest of the release.

- name: upatch-registry
  kind: git
  source: https://github.com/copper-helm/upatch-registry
  version: main
  pin: 24e4f96d8751612f1c65820c87bc07b675ea5199
  track: branch
  note: >-
    upatch.dev's registry: CVE-2025-24813's upatch, built and signed by its tools/build with this
    run's key, and its payloads/ and tools/test, run unchanged in the guest. After the bump:
    `go tool task operator stage cve`.

- name: actionlint
  kind: module
  source: github.com/rhysd/actionlint/cmd/actionlint
  version: v1.7.12
  track: github-release https://github.com/rhysd/actionlint
  note: go tool task lint:workflows, which go tool task lint runs. spin's version.
