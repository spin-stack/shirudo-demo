- name: spin-machine
  kind: download
  source: https://github.com/spin-stack/machine/releases/download/{version}/spin-machine-{version}-linux-x86_64.tar.gz
  version: v20261126.01
  pin: f4fbb082a5e707eaba65eaefdc2648cea621df4028a490a717df7ff1f118b2e4
  track: github-release https://github.com/spin-stack/machine
  note: >-
    the machine the demo boots, as released: QEMU, the kernel with shirudo's hooks, the base image,
    swtpm, passt and bin/spin-machine. `demo machine` downloads it, checks this sha256 and
    the tarball's Sigstore bundle (release.yml at refs/heads/main), and unpacks it in work/machine.
    A bump is a whole run, `go tool task clean default`: shirudo builds against this kernel's BTF.

- name: shirudo
  kind: git
  source: https://github.com/shirudo-dev/shirudo
  version: main
  pin: 5795f8d4a7509af2afeb331046f179300a1756a2
  track: with spin-stack/machine@release shirudo pin
  note: >-
    the shirudo the demo builds in its own container (testing/container) against the release
    kernel's BTF, and whose genkey, gen-image, gen-runtime, gen-initrd, bpm and kernel-obs package
    it uses. It is the commit the pinned spin-machine release carries shirudo's kernel hooks from
    (its versions.yaml's shirudo pin), so the demo tests what the release ships; `go tool task pins`
    fails when the two differ. It moves with spin-machine, and a bump is a whole run,
    `go tool task clean default`.

- name: upatch-registry
  kind: git
  source: https://github.com/copper-helm/upatch-registry
  version: main
  pin: 24e4f96d8751612f1c65820c87bc07b675ea5199
  track: branch
  note: >-
    upatch.dev's registry: CVE-2025-24813's upatch, built and signed by its tools/build with this
    run's key, and its payloads/ and tools/test, run unchanged in the guest. After the bump:
    `go tool task packages stage cve`.

- name: ubuntu
  kind: image
  source: mirror.gcr.io/library/ubuntu
  version: '26.04'
  pin: sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944
  track: digest
  note: >-
    what initrd/Dockerfile is made on: its systemd and dracut make the initrd shirudo's init runs
    in (README, "How the guest differs"). After the bump: `go tool task initrd`, then
    `go tool task stop boot init`.

- name: task
  kind: download
  source: https://github.com/go-task/task/releases/download/v{version}/task_{os}_{arch}.tar.gz
  version: 3.54.0
  pins:
    linux/amd64: 680859dbb4d881a9c72d4d9a8f510825450849af8567deacd7302c01124416fb
    linux/arm64: d7189d439d4a6058e39e1b2acd7c8b27acd4856691b408f23b242e4294e1df5b
  track: github-release https://github.com/go-task/task
  note: >-
    The Task `go tool task` runs (go-tools' cmd/task): Taskfile.yml runs the demo's steps.
